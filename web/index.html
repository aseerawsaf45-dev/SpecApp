<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="AppSpecs - Spectrum Event Operations Platform">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AppSpecs">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AppSpecs · Spectrum</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #070709;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #app-loading-screen {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: radial-gradient(circle at 50% 40%, #161510 0%, #0a0a0c 60%, #050506 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.45s ease-out, visibility 0.45s ease-out;
      pointer-events: all;
    }

    #app-loading-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .brand-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: floatIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .brand-mark {
      position: relative;
      width: 102px;
      height: 102px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-pulse-ring {
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 210, 31, 0.35);
      animation: pulseRing 2.4s cubic-bezier(0.25, 0.8, 0.25, 1) infinite;
    }

    .brand-glow {
      position: absolute;
      inset: -24px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 210, 31, 0.32) 0%, rgba(229, 190, 114, 0.12) 40%, transparent 70%);
      filter: blur(18px);
    }

    .logo-frame {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #0B0B0E;
      border: 2px solid #FFD21F;
      box-shadow: 0 0 30px rgba(255, 210, 31, 0.45), inset 0 0 15px rgba(255, 210, 31, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      overflow: hidden;
      padding: 3px;
    }

    .spectrum-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
    }

    .brand-title {
      font-size: 32px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #FFFFFF 0%, #D4D4D8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 13px;
      font-weight: 500;
      color: #A1A1AA;
      letter-spacing: 0.8px;
      margin-bottom: 32px;
    }

    .progress-track {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      margin-bottom: 16px;
    }

    .progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 40%;
      background: linear-gradient(90deg, #FFD21F, #FFE66B, #FFD21F);
      border-radius: 4px;
      box-shadow: 0 0 12px rgba(255, 210, 31, 0.6);
      animation: shimmerProgress 1.6s ease-in-out infinite alternate;
    }

    .status-text {
      font-size: 11px;
      font-weight: 600;
      color: #71717A;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      animation: pulseText 2s ease-in-out infinite;
    }

    @keyframes floatIn {
      0% { opacity: 0; transform: translateY(14px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1.0); }
    }

    @keyframes pulseRing {
      0% { transform: scale(0.85); opacity: 0.8; }
      50% { transform: scale(1.25); opacity: 0.15; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    @keyframes shimmerProgress {
      0% { left: 0%; width: 25%; }
      50% { left: 35%; width: 45%; }
      100% { left: 70%; width: 30%; }
    }

    @keyframes pulseText {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1.0; color: #D4D4D8; }
    }
  </style>
</head>
<body>
  <!-- High-Performance Animated Loading Screen with Spectrum Logo -->
  <div id="app-loading-screen">
    <div class="brand-container">
      <div class="brand-mark">
        <div class="brand-glow"></div>
        <div class="brand-pulse-ring"></div>
        <div class="logo-frame">
          <img 
            src="spectrum_logo.png" 
            alt="Spectrum" 
            class="spectrum-logo-img"
            onerror="this.onerror=null; this.src='assets/assets/images/app_icon.png';"
          />
        </div>
      </div>
      <h1 class="brand-title">AppSpecs</h1>
      <p class="brand-subtitle">Spectrum Event Operations Platform</p>
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
      <div class="status-text" id="status-label">Initializing Spectrum Environment...</div>
    </div>
  </div>

  <script>
    // Automatically dismiss the splash loader once Flutter renders
    (function() {
      var loader = document.getElementById('app-loading-screen');
      var dismissed = false;

      function hideLoader() {
        if (dismissed || !loader) return;
        dismissed = true;
        loader.classList.add('fade-out');
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 500);
      }

      // Check for Flutter canvas or view elements
      var observer = new MutationObserver(function() {
        var flutterTarget = document.querySelector('flutter-view, flt-glass-pane, flt-scene-host, canvas');
        if (flutterTarget) {
          observer.disconnect();
          setTimeout(hideLoader, 350);
        }
      });

      observer.observe(document.body, { childList: true, subtree: true });

      window.addEventListener('flutter-first-frame', hideLoader);
      setTimeout(hideLoader, 10000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
